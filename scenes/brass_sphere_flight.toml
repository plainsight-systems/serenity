# The brass sphere with six fireflies in flight: each circles the sphere,
# swoops in J-strokes, drifts and travels between, glowing at a quarter of
# its peak, which lights the scene, and flashing to the full peak on each
# climb (core/animation/flight.h, glow.h). The flash shows in the light it
# casts, the pools on the floor and the highlights on the brass; the
# firefly's own body is far above what the display shows at either level,
# so it reads as one brightness until a tone-mapping pass with bloom shows
# brightness as glare. Seen through graphs/path.toml, the window starts over
# every frame; a clean movie takes samples per frame (make movie
# SAMPLES=...).

[camera]
position = [0.0, 1.1, 4.2]
look_at = [0.0, 0.75, 0.0]
vertical_fov_degrees = 38

[environment]
kind = "gradient"
# Moonlit: five times brass_sphere.toml's sky, so the scene reads between
# flashes. The sky is reached by bounces, not chosen among the lights, so it
# leaves the fireflies' sampling as it was.
zenith = [0.01, 0.015, 0.06]
horizon = [0.06, 0.08, 0.175]

[textures.floor_checks]
kind = "checker"
size = 0.4
a = [0.75, 0.72, 0.65]
b = [0.05, 0.05, 0.06]

[materials.brass]
kind = "conductor"
f0 = [0.91, 0.78, 0.42]
roughness = 0.35

[materials.floor]
kind = "rough"
texture = "floor_checks"

[materials.firefly]
kind = "emissive"
radiance = [320.0, 280.0, 70.0]

[[shapes]]
kind = "sphere"
name = "brass"
center = [0.0, 0.75, 0.0]
radius = 0.75
material = "brass"

[[shapes]]
kind = "box"
min = [-200.0, -0.1, -200.0]
max = [200.0, 0.0, 200.0]
material = "floor"

[[shapes]]
kind = "sphere"
center = [-1.05, 0.55, 0.85]
radius = 0.03
material = "firefly"
motion = { kind = "flight", min = [-2.2, 0.12, -2.2], max = [2.2, 2.2, 2.2], targets = ["brass"], speed = 0.45, clearance = 0.06, circle = 3, swoop = 1, drift = 1, seed = 1 }
glow = { kind = "flight", flash = 0.35, dim = 0.25 }

[[shapes]]
kind = "sphere"
center = [0.95, 1.45, -0.55]
radius = 0.03
material = "firefly"
motion = { kind = "flight", min = [-2.2, 0.12, -2.2], max = [2.2, 2.2, 2.2], targets = ["brass"], speed = 0.45, clearance = 0.06, circle = 3, swoop = 1, drift = 1, seed = 2 }
glow = { kind = "flight", flash = 0.35, dim = 0.25 }

