# The marbles at night: the scene the renderer is for (docs/process/
# MEMORY.md, brief: the look of NVIDIA's Marbles at Night). Seen low across
# a dark plank table: three glass spheres and two polished brass ones, under
# an open night sky with a low horizon, lit by 512 fireflies, the scene's
# only lights but a faint sky. Each glass sphere shows tiny refracted
# fireflies and focuses their light on the table, a caustic; the brass shows
# them as sharp points. The fireflies circle the spheres, swoop and drift,
# and flash on their climbs (core/animation/flight.h, glow.h), one swarm
# (core/scene/swarm.h).
#
# Through graphs/path.toml, the naive path tracer: one light of 512 chosen
# uniformly at each bounce, so each frame is noisy, and the caustics are
# reached only by paths that happen to hit a firefly through the glass.
# That noise is the baseline the estimators that follow are measured
# against. The preview counts every light at every pixel, 512 of them, and
# is not for this scene.
#
# Scale: meters. The table top is at 0.75 m, a table's height; the ground
# below it, at 0, is dark grass, seen past the table's far end. The firefly
# radiance is set against a converged still at exposure 0 (graphs/path.toml):
# night, the table lit in pools.
#
# Loads in 104 ms (its flights made in parallel); a path-traced frame at
# 3456 x 2234 is 13.6 ms of the M3 Max's GPU.

[camera]
position = [0.0, 0.93, 1.45]
look_at = [0.0, 0.87, 0.0]
vertical_fov_degrees = 38

[environment]
kind = "gradient"
# Moonless: a faint sky, so the table's far edge and the horizon read; the
# fireflies are the light.
zenith = [0.004, 0.006, 0.02]
horizon = [0.02, 0.028, 0.06]

[textures.walnut]
kind = "wood"
light = [0.13, 0.065, 0.03]
dark = [0.045, 0.02, 0.008]
ring = 0.004
board = 0.16
seed = 3

[materials.table]
kind = "rough"
texture = "walnut"

[materials.grass]
kind = "rough"
color = [0.015, 0.02, 0.012]

[materials.glass]
kind = "dielectric"
ior = 1.5

[materials.brass]
kind = "conductor"
f0 = [0.91, 0.78, 0.42]
roughness = 0.05

[materials.firefly]
kind = "emissive"
radiance = [55.0, 80.0, 12.0]   # yellow-green

# The table: a top 2.8 m by 2.6 m, 3 cm thick, on four legs. The camera is
# over its near end, so all it sees below the horizon is the top.
[[shapes]]
kind = "box"
min = [-1.4, 0.72, -0.9]
max = [1.4, 0.75, 1.7]
material = "table"

[[shapes]]
kind = "box"
min = [-1.34, 0.0, -0.84]
max = [-1.28, 0.72, -0.78]
material = "table"

[[shapes]]
kind = "box"
min = [1.28, 0.0, -0.84]
max = [1.34, 0.72, -0.78]
material = "table"

[[shapes]]
kind = "box"
min = [-1.34, 0.0, 1.58]
max = [-1.28, 0.72, 1.64]
material = "table"

[[shapes]]
kind = "box"
min = [1.28, 0.0, 1.58]
max = [1.34, 0.72, 1.64]
material = "table"

# The ground, to the horizon.
[[shapes]]
kind = "box"
min = [-200.0, -0.1, -200.0]
max = [200.0, 0.0, 200.0]
material = "grass"

# On the table, each resting on its top: its center its radius above 0.75.
[[shapes]]
kind = "sphere"
name = "glass_left"
center = [-0.65, 0.89, 0.1]
radius = 0.14
material = "glass"

[[shapes]]
kind = "sphere"
name = "glass_middle"
center = [0.2, 0.86, 0.2]
radius = 0.11
material = "glass"

[[shapes]]
kind = "sphere"
name = "glass_right"
center = [0.68, 0.91, -0.2]
radius = 0.16
material = "glass"

[[shapes]]
kind = "sphere"
name = "brass_back"
center = [-0.25, 0.88, -0.3]
radius = 0.13
material = "brass"

[[shapes]]
kind = "sphere"
name = "brass_front"
center = [-0.3, 0.84, 0.4]
radius = 0.09
material = "brass"

# The fireflies: over the table, past its sides and far beyond its far end,
# so they are seen at every depth, from just above its top
# to a meter and a half over it: room for a swoop, whose dip, climb and
# headroom take up to 1.2 m.
[[swarms]]
count = 512
radius = 0.008
material = "firefly"
min = [-2.6, 0.78, -3.0]
max = [2.6, 2.2, 1.0]
targets = ["glass_left", "glass_middle", "glass_right", "brass_back", "brass_front"]
speed = 0.35
clearance = 0.03
circle = 2
swoop = 1
drift = 2
flash = 0.35
dim = 0.25
seed = 1
