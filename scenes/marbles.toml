# The marbles at night: the scene the renderer is for (docs/process/
# MEMORY.md, brief: the look of NVIDIA's Marbles at Night). Real marbles, 1.6
# to 2.5 cm across, on a dark plank table, seen from 3 cm above it through a
# lens focused on them, under an open night sky, lit by 512 fireflies, the
# scene's only lights but a faint sky.
#
# Fourteen marbles, each of a kind that shows its own part of the light:
#
#   clear glass   refracts the night upside down, and focuses the fireflies'
#                 light on the table (caustics);
#   tinted glass  the same, in blue, green and amber, deeper where thicker:
#                 glass filled with an absorbing medium (core/media/
#                 absorbing.h);
#   cat's-eyes    a clear shell round an opaque swirled core
#                 (core/textures/swirl.h), lit only through the glass;
#   porcelain     opaque glossy color under a clear coat
#                 (core/materials/coated.h): the color catches every firefly,
#                 the coat shows each as a sharp point;
#   metal         a brass marble and a steel ball bearing, mirrors.
#
# Through graphs/path.toml, the naive path tracer: one light of 512 chosen
# uniformly at each bounce. The porcelain shows that choice's noise most
# plainly, the speckle ReSTIR DI is for; the cores, lit only by paths that
# happen through the glass to a firefly, show the noise manifold next event
# estimation is for; the clear and tinted glass, the caustics. The preview
# counts every light at every pixel, 512 of them, and is not for this scene.
#
# Scale: meters, real ones. The table top is at 0.75 m; each marble rests on
# it, its center its radius above. The firefly radiance is set against a
# converged still at exposure 0 (graphs/path.toml).

[camera]
position = [0.0, 0.785, 0.42]
look_at = [0.0, 0.765, 0.0]
vertical_fov_degrees = 32
# A lens of 5 mm radius focused on the marbles 38 cm away: a macro view,
# the marbles sharp, the fireflies beyond them and before them soft discs.
lens = { radius = 0.005, focus = 0.38 }

[environment]
kind = "gradient"
# Moonless: a faint sky, so the table's far edge and the horizon read; the
# fireflies are the light.
zenith = [0.004, 0.006, 0.02]
horizon = [0.02, 0.028, 0.06]

[textures.walnut]
kind = "wood"
light = [0.13, 0.065, 0.03]
dark = [0.045, 0.02, 0.008]
ring = 0.004
board = 0.16
seed = 3

[textures.orange_swirl]
kind = "swirl"
a = [0.9, 0.3, 0.03]
b = [0.92, 0.88, 0.78]
vanes = 3
twist = 0.6
seed = 1

[textures.blue_swirl]
kind = "swirl"
a = [0.04, 0.2, 0.75]
b = [0.9, 0.92, 0.95]
vanes = 4
twist = -0.4
seed = 2

[textures.red_swirl]
kind = "swirl"
a = [0.7, 0.03, 0.03]
b = [0.95, 0.8, 0.1]
vanes = 2
twist = 0.8
seed = 3

[materials.table]
kind = "rough"
texture = "walnut"

[materials.grass]
kind = "rough"
color = [0.015, 0.02, 0.012]

[materials.glass]
kind = "dielectric"
ior = 1.5

# What fills the tinted marbles (contract 12): the glass's color.
[media.blue_tint]
kind = "absorbing"
tint = [0.25, 0.5, 0.95]
tint_distance = 0.01

[media.green_tint]
kind = "absorbing"
tint = [0.35, 0.85, 0.4]
tint_distance = 0.01

[media.amber_tint]
kind = "absorbing"
tint = [0.95, 0.55, 0.12]
tint_distance = 0.01

[materials.orange_core]
kind = "rough"
texture = "orange_swirl"

[materials.blue_core]
kind = "rough"
texture = "blue_swirl"

[materials.red_core]
kind = "rough"
texture = "red_swirl"

[materials.red_porcelain]
kind = "coated"
color = [0.6, 0.04, 0.03]
ior = 1.5

[materials.white_porcelain]
kind = "coated"
color = [0.8, 0.78, 0.74]
ior = 1.5

[materials.blue_porcelain]
kind = "coated"
color = [0.03, 0.08, 0.45]
ior = 1.5

[materials.brass]
kind = "conductor"
f0 = [0.91, 0.78, 0.42]
roughness = 0.05

[materials.steel]
kind = "conductor"
f0 = [0.56, 0.57, 0.58]
roughness = 0.03

[materials.firefly]
kind = "emissive"
radiance = [390.0, 570.0, 85.0]   # yellow-green

# The table: a top 2.8 m by 2.6 m, 3 cm thick, on four legs.
[[shapes]]
kind = "box"
min = [-1.4, 0.72, -1.6]
max = [1.4, 0.75, 1.0]
material = "table"

[[shapes]]
kind = "box"
min = [-1.34, 0.0, -1.54]
max = [-1.28, 0.72, -1.48]
material = "table"

[[shapes]]
kind = "box"
min = [1.28, 0.0, -1.54]
max = [1.34, 0.72, -1.48]
material = "table"

[[shapes]]
kind = "box"
min = [-1.34, 0.0, 0.88]
max = [-1.28, 0.72, 0.94]
material = "table"

[[shapes]]
kind = "box"
min = [1.28, 0.0, 0.88]
max = [1.34, 0.72, 0.94]
material = "table"

# The ground, to the horizon.
[[shapes]]
kind = "box"
min = [-200.0, -0.1, -200.0]
max = [200.0, 0.0, 200.0]
material = "grass"

# Clear glass; the large one a shooter.
[[shapes]]
kind = "sphere"
name = "clear_shooter"
center = [-0.06, 0.7625, 0.02]
radius = 0.0125
material = "glass"

[[shapes]]
kind = "sphere"
name = "clear_right"
center = [0.11, 0.758, -0.09]
radius = 0.008
material = "glass"

[[shapes]]
kind = "sphere"
name = "clear_left"
center = [-0.2, 0.758, -0.15]
radius = 0.008
material = "glass"

# Tinted glass.
[[shapes]]
kind = "sphere"
name = "blue"
center = [0.04, 0.76, 0.06]
radius = 0.01
material = "glass"
interior = "blue_tint"

[[shapes]]
kind = "sphere"
name = "green"
center = [-0.13, 0.759, -0.03]
radius = 0.009
material = "glass"
interior = "green_tint"

[[shapes]]
kind = "sphere"
name = "amber"
center = [0.19, 0.761, 0.0]
radius = 0.011
material = "glass"
interior = "amber_tint"

# Cat's-eyes: a clear shell, and inside it an opaque swirled core at 60% of
# its radius.
[[shapes]]
kind = "sphere"
name = "cats_eye_orange"
center = [0.0, 0.76, -0.06]
radius = 0.01
material = "glass"

[[shapes]]
kind = "sphere"
center = [0.0, 0.76, -0.06]
radius = 0.006
material = "orange_core"

[[shapes]]
kind = "sphere"
name = "cats_eye_blue"
center = [-0.1, 0.759, 0.07]
radius = 0.009
material = "glass"

[[shapes]]
kind = "sphere"
center = [-0.1, 0.759, 0.07]
radius = 0.0054
material = "blue_core"

[[shapes]]
kind = "sphere"
name = "cats_eye_red"
center = [0.14, 0.7625, -0.2]
radius = 0.0125
material = "glass"

[[shapes]]
kind = "sphere"
center = [0.14, 0.7625, -0.2]
radius = 0.0075
material = "red_core"

# Porcelain.
[[shapes]]
kind = "sphere"
name = "porcelain_red"
center = [0.07, 0.759, -0.16]
radius = 0.009
material = "red_porcelain"

[[shapes]]
kind = "sphere"
name = "porcelain_white"
center = [-0.17, 0.758, 0.04]
radius = 0.008
material = "white_porcelain"

[[shapes]]
kind = "sphere"
name = "porcelain_blue"
center = [-0.04, 0.76, -0.22]
radius = 0.01
material = "blue_porcelain"

# Metal.
[[shapes]]
kind = "sphere"
name = "brass"
center = [0.24, 0.761, -0.1]
radius = 0.011
material = "brass"

[[shapes]]
kind = "sphere"
name = "steel"
center = [-0.24, 0.758, -0.06]
radius = 0.008
material = "steel"

# The fireflies: over the marbles and about them, from just above the table
# to 1.25 m over it, room for most swoops; none closer to the camera than
# 12 cm.
[[swarms]]
count = 512
radius = 0.003
material = "firefly"
min = [-0.9, 0.76, -1.2]
max = [0.9, 2.0, 0.3]
targets = ["clear_shooter", "clear_right", "clear_left", "blue", "green", "amber", "cats_eye_orange",
           "cats_eye_blue", "cats_eye_red", "porcelain_red", "porcelain_white", "porcelain_blue", "brass",
           "steel"]
speed = 0.35
clearance = 0.01
circle = 2
swoop = 1
drift = 2
flash = 0.35
dim = 0.25
seed = 1
