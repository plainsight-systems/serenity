# A glass sphere on a checkerboard floor, under a night sky: the first scene,
# and a nod to its ancestor, Whitted's 1980 glass spheres over a checkerboard.
# Unlit until the fireflies arrive; seen through graphs/preview.toml.

[camera]
position = [0.0, 1.1, 4.2]
look_at = [0.0, 0.75, 0.0]
vertical_fov_degrees = 38

[environment]
kind = "gradient"
zenith = [0.01, 0.015, 0.05]
horizon = [0.12, 0.13, 0.22]

[textures.floor_checks]
kind = "checker"
size = 0.4
a = [0.85, 0.82, 0.75]
b = [0.08, 0.08, 0.10]

[materials.glass]
kind = "dielectric"
ior = 1.5

[materials.floor]
kind = "rough"
texture = "floor_checks"

[[shapes]]
kind = "sphere"
center = [0.0, 0.75, 0.0]
radius = 0.75
material = "glass"

[[shapes]]
kind = "box"
min = [-8.0, -0.1, -8.0]
max = [8.0, 0.0, 8.0]
material = "floor"
