# ReSTIR DI with temporal reuse: resampled importance sampling of the
# lights at the first rough surface, light and BSDF candidates weighed by
# MIS, with visibility reuse; then last frame's reservoir, where the
# surface was, merged in; then the direct light from the survivor and the
# path's continuation as the naive path tracer runs it, converging over
# frames while the image holds still (src/metal/passes/restir_di/
# restir_di.metal.h, steps 1 to 4 and 6), then exposed, bloomed and rolled
# off as the path graph's is. RTXDI's defaults throughout
# (src/core/passes/restir_di.h). Needs a scene.

passes = ["restir_initial", "restir_temporal", "restir_shade", "tone_map"]

[restir_di]
candidates = 8              # M
bsdf_candidates = 1
history = 20                # H: last frame's count capped at H x M
permutation = true
depth_threshold = 0.1
normal_threshold = 0.5
bias_correction = "basic"   # "raytraced" needs last frame's structure, not yet kept
visibility_reuse = true
visibility_age = 4          # frames
visibility_distance = 16.0  # pixels

[tone_map]
exposure = 0.0  # stops
bloom = 0.04    # the fraction of light spread into glare
