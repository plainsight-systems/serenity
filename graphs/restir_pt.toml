# ReSTIR PT, Phase 1: at every pixel a path tree, next event estimation at
# every vertex by resampled importance sampling, resampled to one path;
# then each pixel's path shifted to its three paired neighbors and theirs
# to it (random replay through glass and mirrors, reconnection where the
# footprints allow), merged by pairwise MIS and summed for shading; then
# folded into the accumulated image, converging over frames while the image
# holds still (src/metal/passes/restir_pt/restir_pt.metal.h, steps 1 to 9),
# then exposed, bloomed and rolled off as the path graph's is. ReSTIR PT
# Enhanced's defaults throughout (src/core/passes/restir_pt.h). Temporal
# reuse is Phase 2's. Needs a scene.

passes = ["restir_pt_initial", "restir_pt_spatial", "restir_pt_shade", "tone_map"]

[restir_pt]
nee_candidates = 32  # at the primary hit; 32 / B^2 at vertex B
max_surfaces = 9
footprint = 0.02     # c of the dual footprint test
roughness = 0.2      # alpha_min at x_{k-1}
neighbors = 3        # one per reuse texture
sigma = 16.0         # pixels: matches a disc of radius 30

[tone_map]
exposure = 0.0  # stops
bloom = 0.04    # the fraction of light spread into glare
