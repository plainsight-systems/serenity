# ReSTIR PT: at every pixel a path tree, next event estimation at every
# vertex by resampled importance sampling from the frame's light tiles,
# resampled to one path; last frame's path at where the pixel's surface was
# shifted here and merged by Talbot MIS, its confidence capped by how many
# pixels around it hold copies of it; then each pixel's path shifted to its
# three paired neighbors and theirs to it (random replay through glass and
# mirrors, reconnection where the footprints allow), merged by pairwise MIS
# and summed for shading; folded into the accumulated image, converging over
# frames while the image holds still; the frame's duplication map for the
# next frame's temporal reuse (src/metal/passes/restir_pt/restir_pt.metal.h,
# steps 1 to 13); then exposed, bloomed and rolled off as the path graph's
# is. ReSTIR PT Enhanced's defaults throughout (src/core/passes/restir_pt.h).
# Caustics through glass by manifold next event estimation
# (src/metal/integrator/mnee.metal.h), always, per pixel each frame, not
# reused (docs/research/2026-10-12-mnee.md). Biased as Cycles' MNEE is;
# graphs/path.toml, without it, stays the reference. Needs a scene.

passes = ["restir_pt_initial", "restir_pt_temporal", "restir_pt_spatial", "restir_pt_shade",
          "restir_pt_duplication", "tone_map"]

[restir_pt]
nee_candidates = 32   # at the primary hit; 32 / B^2 at vertex B
max_surfaces = 9
footprint = 0.02      # c of the dual footprint test
roughness = 0.2       # alpha_min at x_{k-1}
neighbors = 3         # one per reuse texture
sigma = 16.0          # pixels: matches a disc of radius 30
confidence_cap = 20.0 # a temporal input's most, in frames' trees
cap_floor = 1.0       # the cap where every neighbor holds a copy
cap_exponent = 0.1    # how fast the cap falls with duplication

[tone_map]
exposure = 0.0  # stops
bloom = 0.04    # the fraction of light spread into glare
