# ReSTIR PT, the renderer the denoiser is for, with the
# denoiser's features beside its light (src/core/contracts/features.h):
# the network's input, the noisy linear radiance (serenity-headless
# --format pfm) and the albedo, normal, depth and motion along the very
# rays that radiance took (--features), at the half resolution the network
# upscales from (docs/research/2026-10-14-denoiser-training-design.md).
# The light is ReSTIR PT's alone, to the bit: the features pass reads
# the scene alone and writes only its own images. Needs a scene.

passes = ["restir_pt_initial", "restir_pt_temporal", "restir_pt_spatial", "restir_pt_shade",
          "restir_pt_duplication", "features", "tone_map"]

[restir_pt]
nee_candidates = 32   # at the primary hit; 32 / B^2 at vertex B
max_surfaces = 9
footprint = 0.02      # c of the dual footprint test
roughness = 0.2       # alpha_min at x_{k-1}
neighbors = 3         # one per reuse texture
sigma = 16.0          # pixels: matches a disc of radius 30
confidence_cap = 20.0 # a temporal input's most, in frames' trees
cap_floor = 1.0       # the cap where every neighbor holds a copy
cap_exponent = 0.1    # how fast the cap falls with duplication

[tone_map]
exposure = 0.0  # stops
bloom = 0.04    # the fraction of light spread into glare
