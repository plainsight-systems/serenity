# ReSTIR PT's light (src/core/passes/restir_pt.h), denoised and upscaled
# by Milestone 3's trained network
# (docs/research/2026-10-15-denoiser-live.md): ReSTIR PT with MNEE and
# the denoiser's features at half the output's size each way;
# the network (src/metal/passes/denoise/denoise.h) writes the output's
# size from them, its own last frame moved by the motion vectors, and the
# full-size albedo; then the tone map, at the output's size. In the window
# the light is traced at a quarter of the window's pixels and the network,
# not the window's layer, brings it to every pixel (core/frame/schedule.h,
# light_size). Needs a scene.
#
# The network is training/export.py's, beside the checkout (make weights
# fetches it). A relative path is relative to this file's directory.

passes = ["restir_pt_initial", "restir_pt_temporal", "restir_pt_spatial", "restir_pt_shade",
          "restir_pt_duplication", "features", "denoise", "tone_map"]

[restir_pt]
nee_candidates = 32   # at the primary hit; 32 / B^2 at vertex B
max_surfaces = 9
footprint = 0.02      # c of the dual footprint test
roughness = 0.2       # alpha_min at x_{k-1}
neighbors = 3         # one per reuse texture
sigma = 16.0          # pixels: matches a disc of radius 30
confidence_cap = 20.0 # a temporal input's most, in frames' trees
cap_floor = 1.0       # the cap where every neighbor holds a copy
cap_exponent = 0.1    # how fast the cap falls with duplication

[denoise]
weights = "../../serenity-data/denoiser-v1-model/wide"

[tone_map]
exposure = 0.0  # stops
bloom = 0.04    # the fraction of light spread into glare
