# ReSTIR DI without reuse: resampled importance sampling of the lights at
# the first rough surface, light and BSDF candidates weighed by MIS, with
# visibility reuse, then the path's
# continuation as the naive path tracer runs it, converging over frames
# while the image holds still (src/metal/passes/restir_di/restir_di.metal.h,
# steps 1 to 3 and 6), then exposed, bloomed and rolled off as the path
# graph's is (src/metal/passes/tone_map/tone_map.h). Needs a scene. With
# candidates = 1 it is naive next event estimation at the first surface.

passes = ["restir_initial", "restir_shade", "tone_map"]

[restir_di]
candidates = 8       # M, RTXDI's default (src/core/passes/restir_di.h)
bsdf_candidates = 1  # RTXDI's default; 0 is light candidates alone

[tone_map]
exposure = 0.0  # stops
bloom = 0.04    # the fraction of light spread into glare
