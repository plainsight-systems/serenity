<svg xmlns="http://www.w3.org/2000/svg" width="780" height="710" viewBox="0 0 780 710" role="img">
<title>Each logical box mapped to the file families that implement it, by layer</title>
<desc>Twelve boxes of the logical overview, each with the directories that implement it, coloured by layer: the platform-neutral core, the Metal backend, the app and headless renderer, and scene data. Light is the widest: the integrator, light selection, sample reuse, lights, materials, textures and the sampler, all in the Metal backend. Beneath them, the contracts in core/contracts are what the families depend on instead of each other.</desc>
<style>
  .bg { fill: #FFFFFF; }
  .th { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5F5E5A; }
  rect { stroke-width: 1; }
  .gray rect   { fill: #F1EFE8; stroke: #888780; } .gray text   { fill: #2C2C2A; }
  .teal rect   { fill: #E1F5EE; stroke: #0F6E56; } .teal text   { fill: #085041; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple text { fill: #3C3489; }
  .coral rect  { fill: #FAECE7; stroke: #D85A30; } .coral text  { fill: #712B13; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#888780" stroke-width="1.5"/>
  </marker>
</defs>
