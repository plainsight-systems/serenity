<g class="gray"><rect x="466" y="20" width="14" height="14" rx="3"/></g><text class="ts" x="486" y="31">logical box, data</text>
<text class="th" x="40" y="62">Logical box</text>
<text class="th" x="250" y="62">File families: src/, and scenes/ at the root</text>
