<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>One frame after another, and the light and image halves overlapped</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="1100" height="360" rx="14" fill="#faf8f4"/>
<text x="30" y="46" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="start">Milestone 3: each frame's light, then its image</text>
<rect x="30" y="62" width="150" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="105" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 1</text>
<rect x="180" y="62" width="90" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="225" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 1</text>
<rect x="270" y="62" width="150" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="345" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 2</text>
<rect x="420" y="62" width="90" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="465" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 2</text>
<rect x="510" y="62" width="150" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="585" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 3</text>
<rect x="660" y="62" width="90" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="705" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 3</text>
<rect x="750" y="62" width="150" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="825" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 4</text>
<rect x="900" y="62" width="90" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="945" y="86.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 4</text>
<text x="30" y="170" font-size="14" font-weight="600" fill="#2f6fdf" text-anchor="start">Milestone 4: the image of one frame beside the light of the next</text>
<text x="30" y="206" font-size="12" font-weight="600" fill="#555" text-anchor="start">queue 1</text>
<text x="30" y="252" font-size="12" font-weight="600" fill="#555" text-anchor="start">queue 2</text>
<rect x="100" y="186" width="210" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="205.0" y="210.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 1</text>
<rect x="310" y="186" width="210" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="415.0" y="210.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 2</text>
<rect x="310" y="232" width="204" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="412.0" y="256.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 1</text>
<rect x="520" y="186" width="210" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="625.0" y="210.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 3</text>
<rect x="520" y="232" width="204" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="622.0" y="256.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 2</text>
<rect x="730" y="186" width="210" height="40" rx="6" fill="#dccdb2" stroke="#ffffff" stroke-width="2"/><text x="835.0" y="210.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 4</text>
<rect x="730" y="232" width="204" height="40" rx="6" fill="#c8d5ea" stroke="#ffffff" stroke-width="2"/><text x="832.0" y="256.5" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 3</text>
<line x1="100" y1="300" x2="1070" y2="300" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1070" y="322" font-size="12" font-weight="400" fill="#555" text-anchor="end">time</text>
<text x="100" y="344" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">Each half is stretched: side by side, they slow each other down.</text>
</svg>
