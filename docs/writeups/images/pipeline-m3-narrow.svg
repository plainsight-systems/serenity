<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 866" width="420" height="866" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Serenity's frame at the end of Milestone 3</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="420" height="866" rx="14" fill="#faf8f4"/>
<rect x="16" y="24" width="388" height="454" rx="10" fill="#efebe3"/>
<text x="40" y="52" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">The light</text><text x="120" y="52" font-size="13" font-weight="400" fill="#555" text-anchor="start">a quarter of the pixels</text>
<rect x="40" y="68" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="90" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Scene</text><text x="205.0" y="109" font-size="13" font-weight="400" fill="#555" text-anchor="middle">fireflies move</text>
<rect x="40" y="134" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="156" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Trace paths</text><text x="205.0" y="175" font-size="13" font-weight="400" fill="#555" text-anchor="middle">ReSTIR PT samples</text>
<rect x="40" y="200" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="222" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Caustics</text><text x="205.0" y="241" font-size="13" font-weight="400" fill="#555" text-anchor="middle">MNEE through glass</text>
<rect x="40" y="266" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="288" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Reuse in time</text><text x="205.0" y="307" font-size="13" font-weight="400" fill="#555" text-anchor="middle">last frame's paths</text>
<rect x="40" y="332" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="354" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Reuse in space</text><text x="205.0" y="373" font-size="13" font-weight="400" fill="#555" text-anchor="middle">neighbors' paths</text>
<rect x="40" y="398" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="420" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Shade</text><text x="205.0" y="439" font-size="13" font-weight="400" fill="#555" text-anchor="middle">the noisy light</text>
<line x1="205.0" y1="120" x2="205.0" y2="132" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="186" x2="205.0" y2="198" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="252" x2="205.0" y2="264" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="318" x2="205.0" y2="330" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="384" x2="205.0" y2="396" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="16" y="524" width="388" height="322" rx="10" fill="#efebe3"/>
<text x="40" y="552" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">The image</text><text x="130" y="552" font-size="13" font-weight="400" fill="#555" text-anchor="start">every pixel</text>
<rect x="40" y="568" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="590" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Surface features</text><text x="205.0" y="609" font-size="13" font-weight="400" fill="#555" text-anchor="middle">color, depth, motion</text>
<rect x="40" y="634" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="656" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Denoise, upscale</text><text x="205.0" y="675" font-size="13" font-weight="400" fill="#555" text-anchor="middle">the trained network</text>
<rect x="40" y="700" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="722" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Tone map</text><text x="205.0" y="741" font-size="13" font-weight="400" fill="#555" text-anchor="middle">exposure, glare</text>
<rect x="40" y="766" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="788" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Screen</text><text x="205.0" y="807" font-size="13" font-weight="400" fill="#555" text-anchor="middle">the finished frame</text>
<line x1="205.0" y1="620" x2="205.0" y2="632" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="686" x2="205.0" y2="698" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="752" x2="205.0" y2="764" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<polyline fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)" points="370,424.0 396,424.0 396,660.0 372,660.0"/>
</svg>
