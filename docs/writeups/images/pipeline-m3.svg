<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Serenity's frame at the end of Milestone 3</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="1200" height="330" rx="14" fill="#faf8f4"/>
<rect x="16" y="22" width="1168" height="116" rx="10" fill="#efebe3"/>
<rect x="16" y="190" width="1168" height="116" rx="10" fill="#efebe3"/>
<text x="34" y="66" font-size="15" font-weight="600" fill="#2b2b2b">The light</text>
<text x="34" y="86" font-size="12.5" fill="#555">a quarter of</text>
<text x="34" y="102" font-size="12.5" fill="#555">the pixels</text>
<text x="34" y="234" font-size="15" font-weight="600" fill="#2b2b2b">The image</text>
<text x="34" y="254" font-size="12.5" fill="#555">every pixel</text>
<rect x="150" y="45" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="215" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Scene</text><text x="215" y="94" text-anchor="middle" font-size="12" fill="#555">fireflies move</text>
<rect x="300" y="45" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="365" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Trace paths</text><text x="365" y="94" text-anchor="middle" font-size="12" fill="#555">ReSTIR PT samples</text>
<rect x="450" y="45" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="515" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Caustics</text><text x="515" y="94" text-anchor="middle" font-size="12" fill="#555">MNEE through glass</text>
<rect x="600" y="45" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="665" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Reuse in time</text><text x="665" y="94" text-anchor="middle" font-size="12" fill="#555">last frame's paths</text>
<rect x="750" y="45" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="815" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Reuse in space</text><text x="815" y="94" text-anchor="middle" font-size="12" fill="#555">neighbors' paths</text>
<rect x="900" y="45" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="965" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Shade</text><text x="965" y="94" text-anchor="middle" font-size="12" fill="#555">the noisy light</text>
<rect x="150" y="213" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="215" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Surface features</text><text x="215" y="262" text-anchor="middle" font-size="12" fill="#555">color, depth, motion</text>
<rect x="450" y="213" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="515" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Denoise, upscale</text><text x="515" y="262" text-anchor="middle" font-size="12" fill="#555">the trained network</text>
<rect x="600" y="213" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="665" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Tone map</text><text x="665" y="262" text-anchor="middle" font-size="12" fill="#555">exposure, glare</text>
<rect x="750" y="213" width="130" height="70" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="815" y="242" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Screen</text><text x="815" y="262" text-anchor="middle" font-size="12" fill="#555">the finished frame</text>
<g stroke="#6b6b6b" stroke-width="1.6" fill="none" marker-end="url(#a)">
<line x1="280" y1="80" x2="298" y2="80"/>
<line x1="430" y1="80" x2="448" y2="80"/>
<line x1="580" y1="80" x2="598" y2="80"/>
<line x1="730" y1="80" x2="748" y2="80"/>
<line x1="880" y1="80" x2="898" y2="80"/>
<line x1="280" y1="248" x2="448" y2="248"/>
<line x1="580" y1="248" x2="598" y2="248"/>
<line x1="730" y1="248" x2="748" y2="248"/>
<polyline points="965,115 965,164 515,164 515,211"/>
</g>
</svg>
