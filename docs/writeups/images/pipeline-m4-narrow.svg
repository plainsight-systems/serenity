<rect x="40" y="398" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="420" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Shade</text><text x="205.0" y="439" font-size="13" font-weight="400" fill="#555" text-anchor="middle">the noisy light</text><circle cx="356" cy="398" r="7" fill="#e47a14" stroke="#faf8f4" stroke-width="2.5"/>
