<line x1="205.0" y1="752" x2="205.0" y2="764" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="818" x2="205.0" y2="830" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="205.0" y1="884" x2="205.0" y2="896" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
