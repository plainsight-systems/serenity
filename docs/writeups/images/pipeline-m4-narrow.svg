<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1122" width="420" height="1122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Serenity's frame at the end of Milestone 4</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="420" height="1122" rx="14" fill="#faf8f4"/>
<rect x="16" y="24" width="388" height="520" rx="10" fill="#efebe3"/>
<text x="40" y="52" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">The light</text><text x="120" y="52" font-size="13" font-weight="400" fill="#555" text-anchor="start">a quarter of the pixels</text>
<text x="380" y="52" font-size="13" font-weight="600" fill="#2f6fdf" text-anchor="end">frame N + 1</text>
<rect x="40" y="68" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="90" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Scene</text><text x="205.0" y="109" font-size="13" font-weight="400" fill="#555" text-anchor="middle">fireflies move</text><circle cx="356" cy="68" r="7" fill="#169e6c" stroke="#faf8f4" stroke-width="2.5"/>
<rect x="40" y="134" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="156" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Trace paths</text><text x="205.0" y="175" font-size="13" font-weight="400" fill="#555" text-anchor="middle">ReSTIR PT samples</text><circle cx="356" cy="134" r="7" fill="#d6457a" stroke="#faf8f4" stroke-width="2.5"/><circle cx="338" cy="134" r="7" fill="#e47a14" stroke="#faf8f4" stroke-width="2.5"/><circle cx="320" cy="134" r="7" fill="#169e6c" stroke="#faf8f4" stroke-width="2.5"/>
