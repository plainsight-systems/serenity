<circle cx="47" cy="1008" r="7" fill="#2f6fdf"/><text x="62" y="1013" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Light and image overlap</text>
<circle cx="47" cy="1032" r="7" fill="#169e6c"/><text x="62" y="1037" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Shadow rays skip the fireflies</text>
<circle cx="47" cy="1056" r="7" fill="#e47a14"/><text x="62" y="1061" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Half the pixels each frame</text>
<circle cx="47" cy="1080" r="7" fill="#8a4fd6"/><text x="62" y="1085" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Network retrained</text>
<circle cx="47" cy="1104" r="7" fill="#d6457a"/><text x="62" y="1109" font-size="13" font-weight="400" fill="#1f1f1f" text-anchor="start">Matched to shipped engines</text>
