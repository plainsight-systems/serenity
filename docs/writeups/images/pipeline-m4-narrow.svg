<line x1="205.0" y1="450" x2="205.0" y2="462" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<circle cx="47" cy="567.0" r="7" fill="#2f6fdf" stroke="#faf8f4" stroke-width="2.5"/><text x="62" y="572.0" font-size="13" font-weight="600" fill="#2f6fdf" text-anchor="start">at the same time</text>
<rect x="16" y="590" width="388" height="388" rx="10" fill="#efebe3"/>
<text x="40" y="618" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="start">The image</text><text x="130" y="618" font-size="13" font-weight="400" fill="#555" text-anchor="start">every pixel</text>
<text x="380" y="618" font-size="13" font-weight="600" fill="#2f6fdf" text-anchor="end">frame N</text>
<rect x="40" y="634" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="656" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Surface features</text><text x="205.0" y="675" font-size="13" font-weight="400" fill="#555" text-anchor="middle">color, depth, motion</text><circle cx="356" cy="634" r="7" fill="#d6457a" stroke="#faf8f4" stroke-width="2.5"/>
<rect x="40" y="700" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="722" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Denoise, upscale</text><text x="205.0" y="741" font-size="13" font-weight="400" fill="#555" text-anchor="middle">the trained network</text><circle cx="356" cy="700" r="7" fill="#8a4fd6" stroke="#faf8f4" stroke-width="2.5"/>
<rect x="40" y="766" width="330" height="52" rx="8" fill="#fbe6ee" stroke="#d6457a" stroke-width="2"/><text x="205.0" y="788" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Depth of field</text><text x="205.0" y="807" font-size="13" font-weight="400" fill="#555" text-anchor="middle">blur by distance</text><circle cx="356" cy="766" r="7" fill="#d6457a" stroke="#faf8f4" stroke-width="2.5"/>
<rect x="40" y="832" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="854" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Tone map</text><text x="205.0" y="873" font-size="13" font-weight="400" fill="#555" text-anchor="middle">exposure, glare</text>
<rect x="40" y="898" width="330" height="52" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="205.0" y="920" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Screen</text><text x="205.0" y="939" font-size="13" font-weight="400" fill="#555" text-anchor="middle">paced by the display</text><circle cx="356" cy="898" r="7" fill="#d6457a" stroke="#faf8f4" stroke-width="2.5"/>
