<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Retraining: the whole data set rendered again on the Mac, trained on the RTX 3090</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="420" height="470" rx="14" fill="#faf8f4"/>
<rect x="40" y="20" width="330" height="74" rx="8" fill="#fff" stroke="#d6457a" stroke-width="2"/><text x="205.0" y="46" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Targets, new</text><text x="205.0" y="66" font-size="13" font-weight="400" fill="#555" text-anchor="middle">the path tracer's clean frames,</text><text x="205.0" y="83" font-size="13" font-weight="400" fill="#555" text-anchor="middle">sharp, rendered on the Mac</text>
<rect x="40" y="110" width="330" height="74" rx="8" fill="#fff" stroke="#e47a14" stroke-width="2"/><text x="205.0" y="136" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Inputs, new</text><text x="205.0" y="156" font-size="13" font-weight="400" fill="#555" text-anchor="middle">traced exactly as the demo traces,</text><text x="205.0" y="173" font-size="13" font-weight="400" fill="#555" text-anchor="middle">checked to the bit</text>
<line x1="210.0" y1="186" x2="210.0" y2="236" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="240" width="330" height="74" rx="8" fill="#fff" stroke="#8a4fd6" stroke-width="2"/><text x="205.0" y="266" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">Training</text><text x="205.0" y="286" font-size="13" font-weight="400" fill="#555" text-anchor="middle">on the RTX 3090</text><text x="205.0" y="303" font-size="13" font-weight="400" fill="#555" text-anchor="middle"></text>
<line x1="210.0" y1="316" x2="210.0" y2="366" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="370" width="330" height="74" rx="8" fill="#fff" stroke="#8a4fd6" stroke-width="2"/><text x="205.0" y="396" font-size="15" font-weight="600" fill="#1f1f1f" text-anchor="middle">The retrained network</text><text x="205.0" y="416" font-size="13" font-weight="400" fill="#555" text-anchor="middle">runs in the renderer</text><text x="205.0" y="433" font-size="13" font-weight="400" fill="#555" text-anchor="middle">on the Mac</text>
</svg>
