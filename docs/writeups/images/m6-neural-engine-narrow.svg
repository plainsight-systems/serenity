<text x="118.4" y="131.5" font-size="11.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 2</text>
<rect x="218.2" y="112" width="182.2" height="30" rx="5" fill="#dccdb2" stroke="#ffffff" stroke-width="1.5"/>
