<rect x="209.5" y="176" width="11.2" height="30" rx="5" fill="#c8d5ea" stroke="#ffffff" stroke-width="1.5"/>
<rect x="222.7" y="178" width="111.9" height="26" rx="5" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 3"/>
