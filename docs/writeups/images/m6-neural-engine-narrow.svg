<text x="404.0" y="336" font-size="11" fill="#555" text-anchor="end">time</text>
<text x="16" y="370" font-size="11.5" fill="#555">Medians at 1920 × 1080: light 11.3 ms, network 6.6 ms,</text>
<text x="16" y="387" font-size="11.5" fill="#555">a frame every 11.9 ms. Nothing is copied between them.</text>
