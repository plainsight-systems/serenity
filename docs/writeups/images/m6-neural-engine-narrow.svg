<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 404" width="420" height="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The denoiser's network on the Neural Engine, beside the next frame's light on the GPU</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
