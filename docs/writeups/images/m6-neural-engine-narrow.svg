<text x="232.1" y="238.0" font-size="11" fill="#555">signal</text>
<text x="325.2" y="238.0" font-size="11" fill="#555" text-anchor="end">signal back</text>
<line x1="16.0" y1="318" x2="404.0" y2="318" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#a)"/>
