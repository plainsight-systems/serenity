<rect x="0" y="0" width="420" height="404" rx="14" fill="#faf8f4"/>
<text x="16" y="34" font-size="16" font-weight="600" fill="#1f1f1f">Each frame's network runs on the Neural</text>
<text x="16" y="55" font-size="16" font-weight="600" fill="#1f1f1f">Engine while the GPU traces the next light</text>
<text x="16" y="105" font-size="11.5" font-weight="600" fill="#555">GPU, queue 1</text>
<text x="16" y="169" font-size="11.5" font-weight="600" fill="#555">GPU, queue 2</text>
<text x="16" y="255" font-size="11.5" font-weight="600" fill="#555">Neural Engine</text>
