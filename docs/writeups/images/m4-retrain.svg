<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Retraining: new inputs, the same targets, trained on the RTX 3090</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="1100" height="250" rx="14" fill="#faf8f4"/>
<rect x="30" y="30" width="260" height="84" rx="8" fill="#fff" stroke="#9b958a" stroke-width="1"/><text x="160.0" y="60" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="middle">Targets, kept</text><text x="160.0" y="82" font-size="12" font-weight="400" fill="#555" text-anchor="middle">the path tracer's clean frames,</text><text x="160.0" y="100" font-size="12" font-weight="400" fill="#555" text-anchor="middle">unchanged by checkerboard</text>
<rect x="30" y="140" width="260" height="84" rx="8" fill="#fff" stroke="#e47a14" stroke-width="2"/><text x="160.0" y="170" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="middle">Inputs, new</text><text x="160.0" y="192" font-size="12" font-weight="400" fill="#555" text-anchor="middle">checkerboard light and features,</text><text x="160.0" y="210" font-size="12" font-weight="400" fill="#555" text-anchor="middle">rendered on the Mac</text>
<rect x="410" y="85" width="260" height="84" rx="8" fill="#fff" stroke="#8a4fd6" stroke-width="2"/><text x="540.0" y="115" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="middle">Training</text><text x="540.0" y="137" font-size="12" font-weight="400" fill="#555" text-anchor="middle">on the RTX 3090</text>
<rect x="790" y="85" width="280" height="84" rx="8" fill="#fff" stroke="#8a4fd6" stroke-width="2"/><text x="930.0" y="115" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="middle">The retrained network</text><text x="930.0" y="137" font-size="12" font-weight="400" fill="#555" text-anchor="middle">runs in the renderer</text><text x="930.0" y="155" font-size="12" font-weight="400" fill="#555" text-anchor="middle">on the Mac</text>
<line x1="290" y1="72" x2="408" y2="115" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="290" y1="182" x2="408" y2="140" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="670" y1="127" x2="788" y2="127" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
