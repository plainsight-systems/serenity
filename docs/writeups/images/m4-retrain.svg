<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Retraining: the whole data set rendered again on the Mac, trained on the RTX 3090</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="1100" height="250" rx="14" fill="#faf8f4"/>
<rect x="30" y="30" width="280" height="84" rx="8" fill="#fff" stroke="#d6457a" stroke-width="2"/><text x="170.0" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Targets, new</text><text x="170.0" y="82" text-anchor="middle" font-size="12" fill="#555">the path tracer's clean frames,</text><text x="170.0" y="100" text-anchor="middle" font-size="12" fill="#555">sharp, rendered on the Mac</text>
<rect x="30" y="140" width="280" height="84" rx="8" fill="#fff" stroke="#e47a14" stroke-width="2"/><text x="170.0" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Inputs, new</text><text x="170.0" y="192" text-anchor="middle" font-size="12" fill="#555">traced exactly as the demo traces,</text><text x="170.0" y="210" text-anchor="middle" font-size="12" fill="#555">checked to the bit</text>
<rect x="420" y="85" width="250" height="84" rx="8" fill="#fff" stroke="#8a4fd6" stroke-width="2"/><text x="545.0" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Training</text><text x="545.0" y="137" text-anchor="middle" font-size="12" fill="#555">on the RTX 3090</text><text x="545.0" y="155" text-anchor="middle" font-size="12" fill="#555"></text>
<rect x="790" y="85" width="280" height="84" rx="8" fill="#fff" stroke="#8a4fd6" stroke-width="2"/><text x="930.0" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">The retrained network</text><text x="930.0" y="137" text-anchor="middle" font-size="12" fill="#555">runs in the renderer</text><text x="930.0" y="155" text-anchor="middle" font-size="12" fill="#555">on the Mac</text>
<line x1="310" y1="72" x2="418" y2="115" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="310" y1="182" x2="418" y2="140" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="670" y1="127" x2="788" y2="127" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
