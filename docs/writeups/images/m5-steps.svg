<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Frames a second at 1920 × 1080 after each step of Milestone 5</title>
<rect x="0" y="0" width="1200" height="500" rx="14" fill="#faf8f4"/>
<text x="24" y="42" font-size="26" font-weight="600" fill="#2b2b2b">Frames a second at 1920 × 1080, the fully lit scene</text>
<text x="438" y="95" font-size="19" text-anchor="end" fill="#3b3b3b">Milestone 4, M3 Max</text>
<rect x="450" y="76" width="209.0" height="28" rx="4" fill="#b9b2a5"/>
<text x="667.0" y="95" font-size="19" font-weight="600" fill="#2b2b2b">57</text>
<text x="438" y="135" font-size="19" text-anchor="end" fill="#3b3b3b">The port to CUDA and OptiX</text>
<rect x="450" y="116" width="327.4" height="28" rx="4" fill="#3f6f8f"/>
<text x="785.4" y="135" font-size="19" font-weight="600" fill="#2b2b2b">89</text>
<text x="438" y="175" font-size="19" text-anchor="end" fill="#3b3b3b">Every shape as triangles on the RT cores</text>
<rect x="450" y="156" width="361.2" height="28" rx="4" fill="#3f6f8f"/>
<text x="819.2" y="175" font-size="19" font-weight="600" fill="#2b2b2b">98</text>
<text x="438" y="215" font-size="19" text-anchor="end" fill="#3b3b3b">MNEE's walks in rounds</text>
<rect x="450" y="196" width="413.2" height="28" rx="4" fill="#3f6f8f"/>
<text x="871.2" y="215" font-size="19" font-weight="600" fill="#2b2b2b">113</text>
<text x="438" y="255" font-size="19" text-anchor="end" fill="#3b3b3b">A register limit above OptiX's default</text>
<rect x="450" y="236" width="429.0" height="28" rx="4" fill="#3f6f8f"/>
<text x="887.0" y="255" font-size="19" font-weight="600" fill="#2b2b2b">117</text>
<text x="438" y="295" font-size="19" text-anchor="end" fill="#3b3b3b">Both reuses over lists of pairs</text>
<rect x="450" y="276" width="475.6" height="28" rx="4" fill="#3f6f8f"/>
<text x="933.6" y="295" font-size="19" font-weight="600" fill="#2b2b2b">130</text>
<text x="438" y="335" font-size="19" text-anchor="end" fill="#3b3b3b">Fast math, as Cycles and pbrt-v4 build</text>
<rect x="450" y="316" width="600.2" height="28" rx="4" fill="#3f6f8f"/>
<text x="1058.2" y="335" font-size="19" font-weight="600" fill="#2b2b2b">164</text>
<text x="438" y="375" font-size="19" text-anchor="end" fill="#3b3b3b">Each program's own register limit</text>
<rect x="450" y="356" width="618.2" height="28" rx="4" fill="#3f6f8f"/>
<text x="1076.2" y="375" font-size="19" font-weight="600" fill="#2b2b2b">169</text>
<text x="438" y="415" font-size="19" text-anchor="end" fill="#3b3b3b">The network on the tensor cores' own shape</text>
<rect x="450" y="396" width="633.2" height="28" rx="4" fill="#3f6f8f"/>
<text x="1091.2" y="415" font-size="19" font-weight="600" fill="#2b2b2b">173</text>
<text x="438" y="455" font-size="19" text-anchor="end" fill="#3b3b3b">Fused shading, RTXDI's reservoir layout</text>
<rect x="450" y="436" width="637.6" height="28" rx="4" fill="#3f6f8f"/>
<text x="1095.6" y="455" font-size="19" font-weight="600" fill="#2b2b2b">174</text>
</svg>
