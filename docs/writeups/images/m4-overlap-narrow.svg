<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>One frame after another, and the light and image halves overlapped</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect x="0" y="0" width="420" height="330" rx="14" fill="#faf8f4"/>
<text x="20" y="36" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="start">Milestone 3: each frame's light,</text>
<text x="20" y="54" font-size="14" font-weight="600" fill="#1f1f1f" text-anchor="start">then its image</text>
<rect x="20" y="68" width="110" height="36" rx="6" fill="#dccdb2" stroke="#fff" stroke-width="2"/><text x="75.0" y="91" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 1</text>
<rect x="130" y="68" width="66" height="36" rx="6" fill="#c8d5ea" stroke="#fff" stroke-width="2"/><text x="163.0" y="91" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 1</text>
<rect x="196" y="68" width="110" height="36" rx="6" fill="#dccdb2" stroke="#fff" stroke-width="2"/><text x="251.0" y="91" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 2</text>
<rect x="306" y="68" width="66" height="36" rx="6" fill="#c8d5ea" stroke="#fff" stroke-width="2"/><text x="339.0" y="91" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 2</text>
<text x="20" y="150" font-size="14" font-weight="600" fill="#2f6fdf" text-anchor="start">Milestone 4: the image of one frame</text>
<text x="20" y="168" font-size="14" font-weight="600" fill="#2f6fdf" text-anchor="start">beside the light of the next</text>
<text x="20" y="203" font-size="11.5" font-weight="600" fill="#555" text-anchor="start">queue 1</text>
<text x="20" y="247" font-size="11.5" font-weight="600" fill="#555" text-anchor="start">queue 2</text>
<rect x="80" y="182" width="110" height="36" rx="6" fill="#dccdb2" stroke="#fff" stroke-width="2"/><text x="135.0" y="205" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 1</text>
<rect x="190" y="182" width="110" height="36" rx="6" fill="#dccdb2" stroke="#fff" stroke-width="2"/><text x="245.0" y="205" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 2</text>
<rect x="190" y="226" width="106" height="36" rx="6" fill="#c8d5ea" stroke="#fff" stroke-width="2"/><text x="243.0" y="249" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 1</text>
<rect x="300" y="182" width="110" height="36" rx="6" fill="#dccdb2" stroke="#fff" stroke-width="2"/><text x="355.0" y="205" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">light 3</text>
<rect x="300" y="226" width="106" height="36" rx="6" fill="#c8d5ea" stroke="#fff" stroke-width="2"/><text x="353.0" y="249" font-size="12.5" font-weight="600" fill="#1f1f1f" text-anchor="middle">image 2</text>
<line x1="80" y1="280" x2="404" y2="280" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="404" y="298" font-size="12" font-weight="400" fill="#555" text-anchor="end">time</text>
<text x="20" y="318" font-size="12.5" font-weight="400" fill="#555" text-anchor="start">Side by side, the halves slow each other down.</text>
</svg>
